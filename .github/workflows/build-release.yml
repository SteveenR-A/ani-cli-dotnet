name: build-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Job 1: Windows MSI (existente) ─────────────────────────────────────
  build-msi:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.*
          wix extension add -g WixToolset.UI.wixext/4.0.5

      - name: Build MSI
        shell: pwsh
        run: ./build-msi.ps1

      - name: Filename to env
        id: version
        shell: pwsh
        run: |
          $tag = "$env:GITHUB_REF_NAME".TrimStart('v')
          "version=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi-installer
          path: Installer/AniCS-Installer.msi

  # ── Job 2: Android APK (nuevo) ─────────────────────────────────────────
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Android workload
        run: dotnet workload install android

      - name: Setup JDK 17 (required by Android SDK tools)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Build Release APK
        run: |
          dotnet publish src/AniCS.Android/AniCS.Android.csproj \
            -c Release \
            -f net10.0-android \
            --no-self-contained \
            -o ./android-out

      # ── APK Signing (only runs when keystore secrets are set) ──────────
      - name: Sign APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          # Decode the base64 keystore from secret
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > anics-release.keystore

          # Find the unsigned APK (dotnet publish may name it differently)
          UNSIGNED=$(find ./android-out -name "*.apk" | head -n 1)

          # Sign with apksigner (comes with Android SDK tools in ubuntu runner)
          $ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -n 1)/apksigner sign \
            --ks anics-release.keystore \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out ./android-out/AniCS-signed.apk \
            "$UNSIGNED"

          echo "APK_PATH=./android-out/AniCS-signed.apk" >> $GITHUB_ENV

      - name: Use unsigned APK if no keystore
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: |
          APK=$(find ./android-out -name "*.apk" | head -n 1)
          cp "$APK" ./android-out/AniCS-unsigned.apk
          echo "APK_PATH=./android-out/AniCS-unsigned.apk" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APK_PATH }}

  # ── Job 3: Create GitHub Release (espera ambos builds) ─────────────────
  create-release:
    runs-on: ubuntu-latest
    needs: [build-msi, build-apk]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download MSI artifact
        uses: actions/download-artifact@v4
        with:
          name: msi-installer
          path: ./release-assets

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: ./release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" ./release-assets/* \
            --title "AniCS $TAG" \
            --generate-notes