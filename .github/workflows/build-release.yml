name: build-release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Job 1: Windows MSI ────────────────────────────────────────────────
  build-msi:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.*
          wix extension add -g WixToolset.UI.wixext/4.0.5

      - name: Build MSI
        shell: pwsh
        run: ./build-msi.ps1

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi-installer
          path: Installer/AniCS-Installer.msi

  # ── Job 2: Android APK ────────────────────────────────────────────────
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Android Workload
        run: |
          dotnet workload install android --source https://api.nuget.org/v3/index.json

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Release APK
        run: |
          dotnet publish src/AniCS.Android/AniCS.Android.csproj \
            -c Release \
            -f net10.0-android \
            -m:1 \
            -p:BuildInParallel=false

      # ── APK Signing (only runs when keystore secrets are set) ──────────
      - name: Process & Sign APK
        run: |
          # Find the generated APK in the bin directory
          APK=$(find src/AniCS.Android/bin/Release/net10.0-android -name "*-Signed.apk" | head -n 1)
          if [ -z "$APK" ]; then
             APK=$(find src/AniCS.Android/bin/Release/net10.0-android -name "*.apk" | head -n 1)
          fi

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Signing APK with repository keystore secret..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > anics-release.keystore
            
            BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
            $BUILD_TOOLS_DIR/apksigner sign \
              --ks anics-release.keystore \
              --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              --out ./AniCS-${{ github.ref_name }}-signed.apk \
              "$APK"
            
            echo "APK_PATH=./AniCS-${{ github.ref_name }}-signed.apk" >> $GITHUB_ENV
          else
            echo "No KEYSTORE_BASE64 secret found; generating temporary debug keystore..."
            keytool -genkey -v -keystore temp.keystore -alias anics -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=AniCS, OU=AniCS, O=AniCS, L=Unknown, S=Unknown, C=Unknown"
            
            BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
            $BUILD_TOOLS_DIR/apksigner sign \
              --ks temp.keystore \
              --ks-pass pass:password \
              --ks-key-alias anics \
              --key-pass pass:password \
              --out ./AniCS-${{ github.ref_name }}-signed.apk \
              "$APK"
            
            echo "APK_PATH=./AniCS-${{ github.ref_name }}-signed.apk" >> $GITHUB_ENV
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APK_PATH }}

  # ── Job 3: Create GitHub Release ──────────────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    needs: [build-msi, build-apk]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download MSI artifact
        uses: actions/download-artifact@v4
        with:
          name: msi-installer
          path: ./release-assets

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: ./release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "$TAG" = "main" ]; then
            TAG="latest"
          fi
          gh release create "$TAG" ./release-assets/* \
            --title "AniCS $TAG" \
            --generate-notes || gh release upload "$TAG" ./release-assets/* --clobber